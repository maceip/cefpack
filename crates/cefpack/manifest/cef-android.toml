# The pinned description of the CEF Android bundle.
#
# This file is the single source of truth for the bundling service.  It names
# the CEF revision that is built, the target it is built for and the
# toolchain that builds it.  It contains no path: paths belong to the machine
# that runs the service and are discovered from the environment.
#
# The revision is a full git SHA.  The Chromium revision that belongs to it
# is not written here: it lives in CEF's own DEPS file, which gclient reads
# and verifies.  A bundle is therefore reproducible from this file alone, and
# no third party archive is trusted at any point.

schema = 1

[engine]
# The CEF release.  The `g6028375` is the CEF revision, the tail is the
# Chromium revision that CEF tracks.
cef_version = "158.0.3+g8c29be2+chromium-158.0.8127.18"
chromium_version = "158.0.8127.18"
# The branch the revision belongs to.  The branches of CEF carry the number
# of the Chromium revision they follow, not the version of Chromium: this
# one follows Chromium 156.0.8078.96, and it is called 8078.
branch = "8127"

[source]
repo = "https://github.com/chromiumembedded/cef.git"
branch = "8127"
# The pinned revision.  `cefpack fetch` checks this out and refuses to build
# anything else.
commit = "8c29be240971eebee960ac92114d3efccb5780ff"

[target]
os = "android"
cpu = "arm64"
abi = "arm64-v8a"
min_sdk = 29

[toolchain]
# The NDK that has to build the engine.  `cefpack plan` refuses a host whose
# NDK carries another version.
ndk_version = "27.2.12479018"
# The NDK is published under a tag, and the tag is the name of the archive:
# `android-ndk-r27c-linux.zip`.  The version and the tag name the same
# release; the version is what the plan checks on the machine, the tag is
# what the installer downloads.
ndk_tag = "r27c"
# The clang that the NDK ships.
clang_version = "18"

# The sysroot of the host: the Debian userland that the build looks the
# packages of the host up in — the NSS, the D-Bus and the Udev among them.
#
# Chromium's DEPS names the sysroot and pins it, but the condition that the
# DEPS carries — `non_git_source` — is false for a checkout that is made
# with git, which is how this service makes its checkout.  `gclient` does
# not fetch it, and the build stops with a message about a `pkg-config`
# that is not there:
#
#     FileNotFoundError: [Errno 2] No such file or directory: 'pkg-config'
#
# The pin below is Chromium's own — it is the one of the DEPS file of the
# pinned revision, and the service checks that the tree agrees with it
# before it downloads anything.
[sysroot]
bucket = "chrome-linux-sysroot"
object = "f851add76bdae472fb6c94b4f920bc4a132d85ac607951391297f636af7e934e"
sha256 = "f851add76bdae472fb6c94b4f920bc4a132d85ac607951391297f636af7e934e"
size = 19314716
path = "src/build/linux/debian_bullseye_amd64-sysroot"

[gn]
# The root of the build.  It is the group that the patch of the service adds
# to the tree of CEF, and not the root of Chromium: the root of Chromium is
# `//:gn_all`, which configures every test of the tree, and one of those
# tests is not configured for Android:
#
#     ERROR at //base/test/BUILD.gn:742:18: Item not found
#         configs -= [ "//build/config/android:hide_all_but_jni_onload" ]
#
# The group is the engine and the shim of the C API, and nothing else.
root_target = "//cef:cef_android"

# The arguments of the Chromium build.  `cefpack build` prints them before it
# runs, so a wrong argument shows up in the log of the build.
args = [
  "target_os=\"android\"",
  "target_cpu=\"arm64\"",
  "is_android=true",
  # The tests of the tree are not built.  Every test of Chromium pulls the
  # browser with it — the test of the message box of the browser is in
  # `//apps`, and the test of the browser is in `//chrome/test` — and the
  # browser brings the user interface of the desktop with it, which
  # Chromium has never built for Android.
  "include_tests=false",
  # Chromium builds the desktop browser for Android in its own configuration,
  # and CEF **is** the desktop browser: the engine of CEF is the browser of
  # Chromium without the shell around it.  The configuration is what turns
  # on the core of the extensions, which the mobile build of Android leaves
  # out and which CEF needs:
  #
  #     ERROR at //extensions/common/BUILD.gn:15:1: Assertion failed.
  #     assert(enable_extensions_core)
  #
  # Chromium turns the flag on for the desktop build of Android and on for
  # nothing else:
  #
  #     enable_extensions_core =
  #         enable_extensions || enable_desktop_android_extensions
  #     enable_desktop_android_extensions = is_desktop_android
  "is_desktop_android=true",
  # The framework of the views is the user interface of the desktop
  # browser, and the browser of CEF is built with it.  Chromium builds it
  # for the desktop platforms only:
  #
  #     toolkit_views = is_mac || is_win || is_linux || is_chromeos || is_fuchsia
  #
  # The patch that the service carries to Chromium relaxes the one place
  # where Chromium ties the flag to the desktop, which is the build of the
  # resources.
  "toolkit_views=true",
  # The CDM of Widevine is a component of the desktop: Chromium names no
  # path for it on Android and stops the build of the configuration.
  "enable_library_cdms=false",
  # The viewer of the PDF and the plugins that it needs.  CEF depends on
  # both, and Chromium builds neither for Android.
  "enable_pdf=true",
  "enable_plugins=true",
  "is_client=false",
  "is_server=false",
  "is_official_build=true",
  # The sysroot of the host: the Debian userland that the build looks the
  # packages of the host up in — the NSS, the D-Bus and the Udev among them.
  # The sysroot is fetched by the service, because `gclient` does not fetch
  # it: the condition of its entry in the DEPS is false for a checkout that
  # is made with git.
  "use_sysroot=true",
  "use_custom_libcxx=true",
  "use_lld=true",
  "is_clang=true",
  "is_debug=false",
  "symbol_level=0",
  "treat_warnings_as_errors=false",
  "enable_nacl=false",
  "chrome_pgo_phase=0",
  # The minimum SDK of Android is not an argument: Chromium sets it to 29,
  # and an argument that no build file declares is an argument that says
  # nothing.
  #
  # The flags that CEF asks for on every platform.  The three that CEF
  # asserts in its own BUILD.gn are *not* here: Chromium turns them off for
  # Android, and the patch that the service carries relaxes the assertions
  # of CEF instead of turning on flags that Chromium refuses.
  "clang_use_chrome_plugins=false",
  "optimize_webui=true",
  "android_static_analysis=\"off\"",
]
# The arguments of a debug build, on top of the ones above.
debug_args = [
  "is_debug=true",
  "symbol_level=1",
  "is_official_build=false",
]

# The headers of Chromium that the public headers of CEF include.  They are
# fetched from the Chromium revision that CEF tracks and their checksums are
# pinned, so that the bindings are generated against the headers of the very
# engine that is shipped.
[chromium]
# CEF is built on top of a Chromium release.  The version names its tag and
# the commit is the pin: the tree that the engine is built from.
#
# CEF's own DEPS file does not name it — that file carries only the hook
# that patches Chromium — so the pin belongs here.
ref = "158.0.8127.18"
commit = "6449d9f9a6a906edff724b7b220199b3fde4615c"
repo = "https://chromium.googlesource.com/chromium/src.git"
base_url = "https://raw.githubusercontent.com/chromium/chromium"

[[chromium.headers]]
path = "net/base/net_error_list.h"
sha256 = "8647b49488fbd0856ff03056c459ddfd115a89533637ddb8037637e9c7def243"

[[chromium.headers]]
path = "ui/color/color_id.h"
sha256 = "1efeb1fcae4047b68e6dcfdc94f2839fb37022f1c17029fedcd59e55d920d813"

[[chromium.headers]]
path = "components/color/color_id.h"
sha256 = "ee89a89f8ae04db661597c1f2f1326e3f49e147072e4be3628a549b757db1021"

[[chromium.headers]]
path = "chrome/browser/ui/color/chrome_color_id.h"
sha256 = "982b4096200dbab5c561a2786d58ac3dd94b91166e9d7a7b38d34f14706af32d"

[[chromium.headers]]
path = "chrome/app/chrome_command_ids.h"
sha256 = "8eca6f326159af678e0715593126c4ac4f6b104c6872865b0810f5de114bc9fc"

[assets]
# The resource files that the engine reads at runtime.  They are collected
# from the build output, never downloaded.
required = [
  "icudtl.dat",
  "resources.pak",
  "chrome_100_percent.pak",
  "chrome_200_percent.pak",
]
# The locales that the engine needs.
locales = ["en-US.pak"]

[contents]
# The public headers that the Rust bindings are generated from.
required_headers = [
  "cef_api_hash.h",
  "cef_app.h",
  "cef_browser.h",
  "cef_client.h",
  "cef_frame.h",
  "cef_settings.h",
  "cef_string.h",
]
# The libraries that the application links against.
required_libraries = [
  "libcef.so",
  "libcef_dll_wrapper.a",
]
# The licence documents that travel with the binary.
required_licences = [
  "LICENSE.txt",
]
