# The build of the engine.
#
# This is the job of this repository: it builds the Chromium Embedded
# Framework for Android out of the pinned sources and hands the result over
# as a bundle.
#
# The build is heavy.  A checkout of Chromium, the build itself and its
# output need roughly 150 GB of disk and a machine with more than 16 GB of
# memory; a GitHub hosted runner has neither.  The job therefore runs on a
# self-hosted runner that carries the label `cef-build`:
#
#   x64, Linux, 150 GB of free disk, 32 GB of memory, git, python3, unzip
#
# The sources and the output of the build are cached between the runs, so
# only the first build pays for the checkout.

name: Build CEF for Android

on:
  workflow_dispatch:
    inputs:
      publish:
        description: publish the bundle as a release
        type: boolean
        default: false
  push:
    tags: ["v*"]
  schedule:
    # Every Monday: pick up a new Chromium release if CEF has a branch for it.
    - cron: "17 5 * * 1"

permissions:
  contents: write

concurrency:
  group: cef-build
  cancel-in-progress: false

jobs:
  build:
    name: build the engine
    runs-on: [self-hosted, linux, x64, cef-build]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - name: the toolchain
        run: |
          sudo ./scripts/install-toolchain.sh /opt/trap-toolchain
          echo "CEF_ANDROID_NDK=/opt/trap-toolchain/ndk-27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/trap-toolchain/android-sdk" >> "$GITHUB_ENV"
          echo "CEF_DEPOT_TOOLS=/opt/trap-toolchain/depot_tools" >> "$GITHUB_ENV"

      - name: libclang
        # The generator of the Rust FFI needs libclang.
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: the cache of the sources and of the output
        uses: actions/cache@v4
        with:
          path: |
            cef-source
            cef-out
          key: cef-build-${{ hashFiles('crates/cefpack/manifest/cef-android.toml') }}
          restore-keys: |
            cef-build-

      - name: the build
        env:
          DEPOT_TOOLS_UPDATE: "0"
        run: |
          source /opt/trap-toolchain/env.sh
          ./scripts/build-android.sh

      - name: the archive of the bundle
        run: |
          tar -czf cef-android-bundle.tar.gz -C cef-bundle .
          sha256sum cef-android-bundle.tar.gz > cef-android-bundle.tar.gz.sha256
          cat cef-android-bundle.tar.gz.sha256

      - name: the verdict on the bundle
        # The audit of the bundle is the last word: it checks the machine of
        # the engine, the symbols of the C API, the headers, the resources,
        # the licences and the checksums.
        run: |
          source /opt/trap-toolchain/env.sh
          ./target/release/cefpack audit

      - uses: actions/upload-artifact@v4
        with:
          name: cef-android-bundle
          path: |
            cef-android-bundle.tar.gz
            cef-android-bundle.tar.gz.sha256
          retention-days: 30

      - name: publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            cef-android-bundle.tar.gz cef-android-bundle.tar.gz.sha256 \
            --title "CEF for Android ${GITHUB_REF_NAME}" \
            --notes "The Chromium Embedded Framework for Android, built from the pinned sources.  See the bundle for the version of CEF, the version of Chromium and the API version of the C API."
