# The build of the engine.
#
# This is the job of this repository: it builds the Chromium Embedded
# Framework for Android out of the pinned sources and hands the result over
# as a bundle.
#
# The build is heavy.  A checkout of Chromium, the build itself and its
# output need roughly 150 GB of disk and hours of CPU; a GitHub hosted runner
# has neither.  The build therefore runs on a Limrun sandbox, which has a
# terabyte of disk and dozens of cores:
#
#   x64, Linux, 1.2 TB of free disk, 96 cores, 249 GB of memory
#
# The machine that orchestrates the run is a GitHub runner, and it does
# nothing but hold the key of the account and wait for the sandbox.
#
# The account is billed by the minute, so the workflow refuses to start when
# there is not enough credit for the build, and the sandbox is deleted when
# the run ends, whatever its outcome.

name: Build CEF for Android

on:
  workflow_dispatch:
    inputs:
      publish:
        description: publish the bundle as a release
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: cef-build
  cancel-in-progress: false

jobs:
  build:
    name: build the engine on Limrun
    # The runner only orchestrates; the build itself runs on the sandbox.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LIM_API_KEY: ${{ secrets.LIMRUN_API_KEY }}
      LIMRUN_TOOLS_DIR: ${{ github.workspace }}/tools
      # The balance of the account is reported in the log of the run.  It is
      # not enforced: an account that is paid after the fact reports no
      # minutes and still accepts the sandbox.  Set it to the minutes the
      # build needs to make the balance a gate.
      CEF_MIN_CREDIT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: the build
        # The script checks the credit, creates the sandbox, synks the
        # sources, runs the build, pulls the bundle back and deletes the
        # sandbox.  It fails when the credit is too small, so that the build
        # is never cut in half.
        run: ./scripts/limrun-build.sh

      - name: the archive of the bundle
        run: |
          ls -la cef-bundle.tar.gz
          cat cef-bundle.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cef-android-bundle
          path: |
            cef-bundle.tar.gz
            cef-bundle.tar.gz.sha256
          retention-days: 30

      - name: publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            cef-bundle.tar.gz cef-bundle.tar.gz.sha256 \
            --title "CEF for Android ${GITHUB_REF_NAME}" \
            --notes "The Chromium Embedded Framework for Android, built from the pinned sources.  See the bundle for the version of CEF, the version of Chromium and the API version of the C API."
