# The checks of the service.
#
# They run on every push and on every pull request.  They need no NDK, no
# Chromium and no network: they prove that the service is sound, not that the
# engine can be built.  The build is the job of `build.yml`.

name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Format, lint, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: The toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: The cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: The format
        run: cargo fmt --all -- --check

      - name: The lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: The tests
        run: cargo test --workspace

      - name: The coverage
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov --workspace --summary-only

      - name: The service answers
        # The service must run and report the state of the host, not fail.
        run: cargo run --quiet -- plan

      - name: The upstream sync & AAR packager self-tests
        run: |
          python3 ./scripts/sync-upstream-chromium.py --self-test
          python3 ./embedder/assemble_aar.py --self-test
          bash -n scripts/build-cefpack-aar.sh scripts/limrun-aar-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
